<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>ARKANA — Indian Cultural Heritage Platform</title>
  <meta name="description" content="Explore 300+ meticulously digitized Indian artifacts, monuments, and cultural traditions through AI-grounded knowledge."/>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind Config (Design System Tokens) -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "secondary": "#5f5e5e",
            "on-surface-variant": "#4e4637",
            "primary": "#6f5100",
            "surface-bright": "#fbf9f5",
            "surface-container-low": "#f5f3ef",
            "primary-fixed-dim": "#ecc165",
            "surface-dim": "#dbdad6",
            "outline-variant": "#d1c5b2",
            "on-surface": "#1b1c1a",
            "outline": "#807665",
            "background": "#fbf9f5",
            "surface-container-highest": "#e4e2de",
            "secondary-container": "#e2dfde",
            "on-primary": "#ffffff",
            "surface-container": "#efeeea",
            "on-background": "#1b1c1a",
            "inverse-surface": "#30312e",
            "secondary-fixed": "#e5e2e1",
            "secondary-fixed-dim": "#c8c6c5",
            "primary-container": "#8b6914",
            "on-primary-container": "#fff0da",
            "primary-fixed": "#ffdfa0",
            "surface": "#fbf9f5",
            "surface-container-high": "#eae8e4",
            "inverse-primary": "#ecc165",
            "surface-container-lowest": "#ffffff",
            "surface-variant": "#e4e2de",
          },
          spacing: {
            "gutter": "24px",
            "desktop_padding": "80px",
            "section_v_spacing": "120px",
            "max_width": "1280px",
            "mobile_padding": "20px",
            "tablet_padding": "40px"
          },
          fontFamily: {
            "body-lg": ["Inter"],
            "label-sm": ["Inter"],
            "section-label": ["Playfair Display"],
            "display-lg-mobile": ["Playfair Display"],
            "headline-md": ["Playfair Display"],
            "display-lg": ["Playfair Display"],
            "body-md": ["Inter"]
          },
          fontSize: {
            "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
            "label-sm": ["12px", {"lineHeight": "1.4", "letterSpacing": "0.02em", "fontWeight": "500"}],
            "section-label": ["14px", {"lineHeight": "1", "letterSpacing": "0.12em", "fontWeight": "500"}],
            "display-lg-mobile": ["40px", {"lineHeight": "1.2", "fontWeight": "600"}],
            "headline-md": ["32px", {"lineHeight": "1.3", "fontWeight": "500"}],
            "display-lg": ["64px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600"}],
            "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
          }
        }
      }
    }
  </script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css"/>
</head>

<body class="bg-background text-on-surface font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">

  <!-- ================================
       GEOMETRIC WIPE TRANSITION OVERLAY
       ================================ -->
  <div id="transition-overlay" aria-hidden="true">
    <div class="wipe-piece"></div>
    <div class="wipe-piece"></div>
    <div class="wipe-piece"></div>
    <div class="wipe-piece"></div>
  </div>

  <!-- Expanding Card Cover -->
  <div id="card-cover"></div>

  <!-- ================================
       MOBILE MENU
       ================================ -->
  <div id="mobile-menu" role="dialog" aria-modal="true" aria-label="Navigation menu">
    <button id="mobile-menu-close" class="absolute top-6 right-6 text-on-surface" aria-label="Close menu">
      <span class="material-symbols-outlined text-3xl">close</span>
    </button>
    <a href="#" data-page="home" class="mobile-nav-link font-headline-md text-headline-md text-on-surface hover:text-primary-container transition-colors">Home</a>
    <a href="#" data-page="explore" class="mobile-nav-link font-headline-md text-headline-md text-on-surface hover:text-primary-container transition-colors">Explore</a>
    <a href="#" data-page="browse" class="mobile-nav-link font-headline-md text-headline-md text-on-surface hover:text-primary-container transition-colors">Browse</a>
    <a href="#" data-page="culture" class="mobile-nav-link font-headline-md text-headline-md text-on-surface hover:text-primary-container transition-colors">Cultures</a>
    <a href="#" data-page="identify" class="mobile-nav-link font-headline-md text-headline-md text-on-surface hover:text-primary-container transition-colors">Identify</a>
    <a href="#" data-page="login" class="mobile-nav-link font-headline-md text-headline-md text-on-surface hover:text-primary-container transition-colors">Sign In</a>
  </div>

  <!-- ================================
       NAVBAR
       ================================ -->
  <nav id="navbar" class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md border-b border-transparent" role="navigation" aria-label="Main navigation">
    <div class="flex justify-between items-center px-mobile_padding md:px-desktop_padding h-20 w-full max-w-max_width mx-auto">
      <a href="#" data-page="home" class="nav-link font-section-label text-headline-md italic text-on-surface tracking-widest hover:opacity-70 transition-opacity" aria-label="ARKANA Home">ARKANA.</a>
      
      <div class="hidden md:flex items-center gap-8 font-body-md text-body-md">
        <a href="#" data-page="explore" class="nav-link text-on-surface-variant hover:text-primary transition-colors duration-300 scale-95 hover:scale-100 transition-transform">Explore</a>
        <a href="#" data-page="culture" class="nav-link text-on-surface-variant hover:text-primary transition-colors duration-300 scale-95 hover:scale-100 transition-transform">Cultures</a>
        <a href="#" data-page="browse" class="nav-link text-on-surface-variant hover:text-primary transition-colors duration-300 scale-95 hover:scale-100 transition-transform">Browse</a>
        <a href="#" data-page="identify" class="nav-link text-on-surface-variant hover:text-primary transition-colors duration-300 scale-95 hover:scale-100 transition-transform">Identify</a>
        <a href="#" data-page="explore" class="nav-link text-on-surface-variant hover:text-primary transition-colors duration-300 scale-95 hover:scale-100 transition-transform">Ask Arkana</a>
      </div>

      <div class="flex items-center gap-4 text-primary-container">
        <button aria-label="Search" class="hover:opacity-70 transition-opacity scale-95 hover:scale-100 transition-transform">
          <span class="material-symbols-outlined">search</span>
        </button>
        <a href="#" data-page="login" class="nav-link hidden md:block">
          <div class="w-8 h-8 rounded-full bg-surface-container border border-outline-variant flex items-center justify-center hover:border-primary-container transition-colors">
            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">person</span>
          </div>
        </a>
        <button id="hamburger" class="md:hidden text-on-surface hover:text-primary-container transition-colors" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ================================
       PAGE CONTAINERS
       Pages are loaded from /pages/*.html
       ================================ -->
  <div id="page-home" class="page active"></div>
  <div id="page-explore" class="page"></div>
  <div id="page-browse" class="page"></div>
  <div id="page-culture" class="page"></div>
  <div id="page-artifact" class="page"></div>
  <div id="page-identify" class="page"></div>
  <div id="page-login" class="page"></div>

  <!-- ================================
       SCRIPTS (modular)
       ================================ -->
  <script src="js/animations.js"></script>
  <script src="js/components.js"></script>
  <script src="js/router.js"></script>

</body>
</html>
