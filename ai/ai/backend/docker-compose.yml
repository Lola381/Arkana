

services:
  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: arkana_postgres
    environment:
      POSTGRES_DB: arkana
      POSTGRES_USER: arkana
      POSTGRES_PASSWORD: arkana_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkana -d arkana"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis (Query Cache) ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: arkana_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ── Qdrant (Vector Store) ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: arkana_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── pgAdmin (DB management UI — dev only) ────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: arkana_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@arkana.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - dev   # Only starts with: docker compose --profile dev up
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  default:
    name: arkana_network
