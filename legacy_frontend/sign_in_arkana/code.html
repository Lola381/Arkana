<style>
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 800ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Heritage Link sliding underline */
        .heritage-link {
            position: relative;
            display: inline-block;
            color: #8b6914; /* primary-container approx, using explicit value as per guidance */
        }
        .heritage-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: #8b6914;
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .heritage-link:hover::after {
            width: 100%;
        }

        .input-field {
            transition: border-color 0.3s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: #8b6914; /* Focus state from guidance */
            box-shadow: none;
        }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-mobile_padding md:p-desktop_padding">
<!-- Auth Page Container - No Nav/Footer for transactional page -->
<div class="w-full max-w-md mx-auto fade-in-up">
<!-- Brand / Logo Area -->
<div class="text-center mb-12">
<h1 class="font-section-label text-headline-md italic text-on-surface mb-6">ARKANA.</h1>
<h2 class="font-headline-md text-on-surface mb-2" style="font-size: 28px;">Welcome to Arkana</h2>
<p class="font-body-md text-on-surface-variant">Sign in to save your explorations</p>
</div>
<!-- Artifact Card for Form -->
<div class="bg-surface-container-lowest rounded shadow-[0_1px_3px_rgba(0,0,0,0.06)] border border-outline-variant/50 p-8">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-sm text-on-surface-variant mb-2" for="email">Email Address</label>
<input class="input-field w-full bg-transparent border-0 border-b border-outline-variant py-3 px-0 font-body-md text-on-surface placeholder:text-outline/50 focus:ring-0" id="email" name="email" placeholder="Enter your email" required="" type="email"/>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm heritage-link" href="#">Forgot?</a>
</div>
<input class="input-field w-full bg-transparent border-0 border-b border-outline-variant py-3 px-0 font-body-md text-on-surface placeholder:text-outline/50 focus:ring-0" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full flex items-center justify-center py-3 px-4 border border-[#1A1A1A] rounded bg-[#1A1A1A] text-[#FAF8F4] font-body-md font-semibold transition-colors duration-300 hover:bg-transparent hover:text-[#1A1A1A] mt-8" type="submit">
                    Sign In
                </button>
</form>
<div class="mt-8 flex items-center justify-center">
<span class="h-px bg-outline-variant flex-1"></span>
<span class="px-4 font-label-sm text-on-surface-variant uppercase tracking-widest">Or continue with</span>
<span class="h-px bg-outline-variant flex-1"></span>
</div>
<!-- OAuth Button -->
<div class="mt-8">
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-md transition-colors duration-300 hover:bg-surface-container-low hover:border-outline" type="button">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
</div>
</div>
<!-- Registration Toggle -->
<div class="mt-8 text-center">
<p class="font-body-md text-on-surface-variant">
                Don't have an account? <a class="heritage-link ml-1" href="#">Register</a>
</p>
</div>
</div>
</body></html>
